name: Poker Bot Runner nya '-'

on:
  schedule:
    # Runs at minute 0 of every 6th hour (e.g., 00:00, 06:00, 12:00, 18:00)
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allows manual trigger from the Actions tab

# Prevent the "instant cancel" bug.
# If a job is running, the new one will wait in the queue instead of killing the old one.
concurrency:
  group: poker-bot-group
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # 5 hours 40 mins. GitHub sends SIGTERM 5 mins before this limit (at 5h 35m).
    # This leaves a 25-minute gap before the next cron triggers at the 6-hour mark.
    timeout-minutes: 340
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip' # Caches dependencies to speed up startup

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Restore Opponent Database
        uses: actions/cache/restore@v4
        with:
          path: opponent_memory.db
          key: poker-db-${{ github.run_id }}
          restore-keys: |
            poker-db-

      - name: Run Bot
        env:
          OPEN_POKER_API_KEY: ${{ secrets.OPEN_POKER_API_KEY }}
          MALLOC_TRIM_THRESHOLD_: "65536"
          MALLOC_MMAP_THRESHOLD_: "65536"
          PYTHONMALLOC: "malloc"
          CPU_WORKERS: "4"
          MC_MAX_ITERS: "200000"
        run: python bot5.py
        # When timeout-minutes hits 340, GitHub sends SIGTERM. 
        # Our Python code catches it, flushes SQLite to disk, and exits.

      - name: Save Opponent Database
        if: always() # Save DB even if the run failed, timed out, or was cancelled
        uses: actions/cache/save@v4
        with:
          path: opponent_memory.db
          key: poker-db-${{ github.run_id }}
