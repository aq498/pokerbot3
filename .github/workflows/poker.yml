name: OpenPoker Bot 24/7

on:
  workflow_dispatch: # Only manual trigger and self-trigger

permissions:
  actions: write
  contents: read

concurrency:
  group: openpoker-bot
  cancel-in-progress: false

jobs:
  play-poker:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 5 hours 50 mins (Hard cap is 6 hours)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Opponent Database
        uses: actions/cache/restore@v4
        with:
          path: opponent_memory.db
          key: poker-db-${{ github.run_id }}
          restore-keys: |
            poker-db-

      - name: Run Bot
        env:
          PYTHONUNBUFFERED: "1"
          OPEN_POKER_API_KEY: ${{ secrets.OPEN_POKER_API_KEY }}
          MALLOC_TRIM_THRESHOLD_: "65536"
          MALLOC_MMAP_THRESHOLD_: "65536"
          PYTHONMALLOC: "malloc"
          CPU_WORKERS: "4"
          MC_MAX_ITERS: "200000"
        run: python -u bot5.py

      - name: Save Opponent Database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: opponent_memory.db
          key: poker-db-${{ github.run_id }}

      - name: Trigger Next Run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "OpenPoker Bot 24/7"
